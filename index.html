<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vida Abundante Audios</title>

  <!-- Vista previa redes -->
  <meta property="og:title" content="Vida Abundante Audios" />
  <meta property="og:description" content="Escucha devocionales, ABC bíblico y más." />
  <meta property="og:image" content="icons/icon-512.png" />
  <meta name="theme-color" content="#ffffff" />

  <!-- MANIFEST -->
  <link rel="manifest" href="manifest.json" />

  <!-- ICONO -->
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-512.png" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    #installButton {
      display: none;
      background: #007bff;
      color: #fff;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin: 20px auto;
      display: block;
    }

    .container {
      text-align: center;
      padding-top: 20px;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 40px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="installButton">📱 Ver como aplicación</button>
  </div>

  <!-- ENTRAR DIRECTO A LA PLAYLIST -->
  <iframe src="https://vida-abundante.github.io/playlist-audio"></iframe>

  <script>
    let deferredPrompt;
    const installButton = document.getElementById("installButton");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installButton.style.display = "block";
    });

    installButton.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;

      if (outcome === "accepted") {
        installButton.style.display = "none";
      }

      deferredPrompt = null;
    });

    // Detectar si está instalada (ocultar botón)
    window.addEventListener("appinstalled", () => {
      installButton.style.display = "none";
    });
  </script>

</body>
</html>
