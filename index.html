<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Playlist – Vida Abundante (con Devocionales)</title>

  <meta property="og:title" content="Mi Playlist – Vida Abundante" />
  <meta property="og:description" content="Escuchá los audios de enseñanza y los devocionales de la Iglesia Cristiana de la Vida Abundante 💖" />
  <meta property="og:image" content="https://vida-abundante.github.io/playlist-audio/PortadaCuadrada.jpeg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vida-abundante.github.io/playlist-audio/" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="PortadaCuadrada.png" />
  <meta name="theme-color" content="#fffafc" />

  <style>
    :root{
      --bg: #fffafc;
      --text: #3a2a2a;
      --primary: #007bff;
      --accent: #83bde3;
      --green: #28a745;
      --danger: #dc3545;
    }
    html,body{height:100%;}
    body {
      font-family: "Poppins", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing:antialiased;
    }

    /* Layout: two columns */
    .layout{
      display: grid;
      grid-template-columns: 1fr 360px; /* left flexible, right fixed */
      gap: 18px;
      max-width: 1100px;
      margin: 18px auto;
      padding: 18px;
      align-items: start;
    }

    @media (max-width: 860px){
      .layout{grid-template-columns: 1fr;}
      .right-column{order:2}
      .left-column{order:1}
    }

    header{ text-align:center; padding: 12px 0; }
    h1{margin:0.2rem}

    .card{
      background: white;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    /* Left: Devocionales list */
    .left-column .card{min-height: 380px}
    #devocionalesList{display:flex;flex-direction:column;gap:8px}
    .dev-btn{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 12px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);
      background:linear-gradient(180deg,#fff,#f8f9fb);
      cursor:pointer;font-size:16px;
    }
    .dev-btn[aria-pressed="true"]{background:#e8f4ff;border-color:var(--accent)}
    .dev-title{flex:1;text-align:left;margin-right:12px}
    .dev-meta{font-size:13px;color:#666}

    /* Right: existing playlist */
    .right-column .track-btn{display:block;margin:8px auto;padding:12px 18px;width:90%;border-radius:10px}

    /* Player */
    .player-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
    #player{width:100%;max-width:420px}
    .controls{display:flex;gap:8px;align-items:center}
    .control-btn{font-size:20px;padding:10px 14px;border-radius:10px;border:none;background:var(--primary);color:#fff}

    /* Now playing */
    #nowPlaying{font-size:16px;color:#222;margin:6px 0}

    /* Small helpers */
    .muted{opacity:0.7}

    /* Loader */
    #loader{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999}

  </style>
</head>
<body>
  <div id="loader"><div class="card"><strong>Abriendo...</strong></div></div>

  <header>
    <h1>Mi Playlist – Vida Abundante</h1>
    <p class="muted">Reproductor accesible — Devocionales a la izquierda, playlist a la derecha</p>
  </header>

  <main class="layout">
    <!-- LEFT: Devocionales dinámicos -->
    <section class="left-column card" aria-label="Devocionales">
      <h3>Devocionales</h3>
      <div id="devocionalesList" role="list" aria-live="polite">
        <!-- Botones generados dinámicamente -->
      </div>
      <div style="margin-top:12px;font-size:13px;color:#555">Los devocionales nuevos se irán sumando automáticamente.</div>
    </section>

    <!-- RIGHT: Reproductor + lista existente -->
    <aside class="right-column card" aria-label="Reproductor y lista">
      <div class="player-wrap">
        <div class="controls">
          <button id="prevBtn" class="control-btn" aria-label="Anterior">⏮</button>
          <button id="playPause" class="control-btn" aria-label="Reproducir/Pausar">▶</button>
          <button id="nextBtn" class="control-btn" aria-label="Siguiente">⏭</button>
        </div>

        <audio id="player" controls preload="metadata"></audio>
        <div id="nowPlaying">🎵 Reproduciendo: Nada</div>

        <hr style="width:90%;opacity:0.06;margin:12px auto" />

        <div id="playlistButtons" aria-label="Secciones">
          <!-- Se mantienen tus botones existentes -->
          <button class="track-btn">▶ Salvación</button>
          <button class="track-btn">▶ Pecado</button>
          <button class="track-btn">▶ La Palabra</button>
          <button class="track-btn">▶ La Oración</button>
          <button class="track-btn">▶ Espíritu Santo</button>
          <button class="track-btn">▶ Bautismo</button>
          <button class="track-btn">▶ Mayordomía</button>
          <button class="track-btn">▶ Evangelismo</button>
          <button class="track-btn">▶ Visión de la iglesia</button>
        </div>

      </div>
    </aside>
  </main>

  <script>
    // ---------- CONFIG ----------
    const REPO_RAW_JSON = "https://raw.githubusercontent.com/Vida-Abundante/playlist-audio/main/devocionales.json";
    const DEV_BASE = "https://vida-abundante.github.io/playlist-audio/devocionales/"; // carpeta donde estarán los mp3

    // ---------- datos actuales (tu lista existente) ----------
    const base = "https://vida-abundante.github.io/playlist-audio/";
    const sections = [
      ["Salvación.mp3"],
      ["Pecado.mp3"],
      ["La palabra 1.mp3","La palabra 2.mp3","La palabra 3.mp3"],
      ["La oración 1.mp3","La oración 2.mp3","La oración 3.mp3","La oración 4.mp3","La oración 5.mp3"],
      ["Espíritu Santo 1.mp3","Espíritu Santo 2.mp3","Espíritu Santo 3.mp3"],
      ["Bautismo 1.mp3","Bautismo 2.mp3"],
      ["Mayordomía 1.mp3","Mayordomía 2.mp3"],
      ["Evangelismo.mp3"],
      ["Visión de la iglesia.mp3"]
    ];

    const sectionNames = ["Salvación","Pecado","La Palabra","La Oración","Espíritu Santo","Bautismo","Mayordomía","Evangelismo","Visión de la iglesia"];

    // ---------- variables de reproducción ----------
    const player = document.getElementById("player");
    const prevBtn = document.getElementById("prevBtn");
    const playPause = document.getElementById("playPause");
    const nextBtn = document.getElementById("nextBtn");
    const nowPlaying = document.getElementById("nowPlaying");
    const devListEl = document.getElementById("devocionalesList");

    let fullPlaylist = sections.flat().map(name => base + name);
    let devocionales = []; // se cargará desde JSON

    // indices para reproducción "full" entre playlist+devocionales
    let combinedList = [...fullPlaylist];
    let combinedLabels = [];

    // estado
    let mode = "none"; // 'none' | 'full' | 'section' | 'dev'
    let currentList = [];
    let currentIndex = 0;

    // ---------- helpers ----------
    function setNowPlayingLabel(label){ nowPlaying.textContent = `🎵 Reproduciendo: ${label}`; }

    function playFromList(list, index, label){
      currentList = list;
      currentIndex = index;
      player.src = list[index];
      player.play().catch(()=>{});
      setNowPlayingLabel(label || extractLabelFromSrc(player.src));
      guardarProgreso();
    }

    function extractLabelFromSrc(src){
      if(!src) return "Nada";
      const clean = decodeURIComponent(src.split("?")[0]);
      // buscar en devocionales
      for(const d of devocionales){ if(clean.endsWith(d.file)) return d.title; }
      // buscar en sections
      for(let s=0; s<sections.length; s++){
        for(let i=0;i<sections[s].length;i++){
          if(clean.endsWith(sections[s][i])){
            const pos = sections[s].length>1?` (${i+1} de ${sections[s].length})`:'';
            return sectionNames[s]+pos;
          }
        }
      }
      return 'Reproduciendo';
    }

    // ---------- carga devocionales desde JSON ----------
    async function cargarDevocionales(){
      try{
        const r = await fetch(REPO_RAW_JSON,{cache:'no-store'});
        if(!r.ok) throw new Error('no json');
        const data = await r.json();
        // Esperamos array [{title,file}]
        devocionales = Array.isArray(data)?data:[];
      }catch(e){
        console.warn('No se pudo cargar JSON devocionales',e);
        devocionales = [];
      }

      renderDevocionales();
      rebuildCombinedList();
    }

    function renderDevocionales(){
      devListEl.innerHTML = '';
      if(devocionales.length===0){
        devListEl.innerHTML = '<div class="muted">No hay devocionales todavía.</div>';
        return;
      }

      devocionales.forEach((d, idx) =>{
        const btn = document.createElement('button');
        btn.className = 'dev-btn';
        btn.setAttribute('role','listitem');
        btn.setAttribute('aria-pressed','false');
        btn.innerHTML = `<div class="dev-title">${d.title}</div><div class="dev-meta">${d.file}</div>`;
        btn.addEventListener('click', ()=>{
          // reproducir el devocional seleccionado
          const url = DEV_BASE + d.file;
          mode = 'dev';
          playFromList([url], 0, d.title);
          // marcar como presionado
          Array.from(devListEl.children).forEach(c=>c.setAttribute('aria-pressed','false'));
          btn.setAttribute('aria-pressed','true');
        });
        devListEl.appendChild(btn);
      });
    }

    // ---------- combinar listas para 'lista completa' si querés incluir devocionales al final ----------
    function rebuildCombinedList(){
      combinedList = [...fullPlaylist];
      combinedLabels = fullPlaylist.map(src=>extractLabelFromSrc(src));
      // agregar devocionales al final del combined (opcional)
      devocionales.forEach(d => { combinedList.push(DEV_BASE + d.file); combinedLabels.push(d.title); });
    }

    // ---------- controles ----------
    playPause.addEventListener('click', ()=>{
      if(!player.src){ // iniciar full lista combinada
        mode='full';
        playFromList(combinedList,0,combinedLabels[0]);
        return;
      }
      if(player.paused) player.play(); else player.pause();
      guardarProgreso();
    });

    nextBtn.addEventListener('click', ()=>{
      if(currentIndex+1 < currentList.length){ playFromList(currentList, currentIndex+1); }
      else if(mode==='full' && currentIndex+1 < combinedList.length){ playFromList(combinedList, currentIndex+1, combinedLabels[currentIndex+1]); }
    });
    prevBtn.addEventListener('click', ()=>{ if(currentIndex>0) playFromList(currentList, currentIndex-1); });

    player.addEventListener('ended', ()=>{
      if(currentIndex+1 < currentList.length) playFromList(currentList, currentIndex+1);
      else if(mode==='full' && currentIndex+1 < combinedList.length) playFromList(combinedList, currentIndex+1, combinedLabels[currentIndex+1]);
      else { player.pause(); setNowPlayingLabel('Nada'); mode='none'; }
    });

    // ---------- progreso localStorage (por separado para devocionales y playlist) ----------
    function guardarProgreso(){
      const state = {
        mode: mode,
        currentSrc: player.src || '',
        currentTime: player.currentTime || 0
      };
      localStorage.setItem('va_player_state', JSON.stringify(state));
    }

    function restaurarProgreso(){
      try{
        const raw = localStorage.getItem('va_player_state');
        if(!raw) return;
        const s = JSON.parse(raw);
        if(s.currentSrc){
          player.src = s.currentSrc;
          player.currentTime = s.currentTime || 0;
          setNowPlayingLabel(extractLabelFromSrc(s.currentSrc));
          mode = s.mode || 'none';
        }
      }catch(e){console.warn('no restore',e)}
    }

    // guardado periódico
    setInterval(()=>{ if(!player.paused) guardarProgreso(); }, 10000);

    // ---------- inicialización ----------
    document.addEventListener('DOMContentLoaded', async ()=>{
      await cargarDevocionales();
      restaurarProgreso();
      document.getElementById('loader').style.display='none';
    });

  </script>

</body>
</html>
