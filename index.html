<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Playlist – Vida Abundante</title>

  <meta property="og:title" content="Mi Playlist – Vida Abundante" />
  <meta property="og:description" content="Escuchá los audios de enseñanza de la Iglesia Cristiana de la Vida Abundante 💖" />
  <meta property="og:image" content="https://vida-abundante.github.io/playlist-audio/PortadaCuadrada.jpeg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vida-abundante.github.io/playlist-audio/" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="PortadaCuadrada.png" />
  <meta name="theme-color" content="#fffafc" />

  <style>
    :root{
      --bg: #fffafc;
      --text: #3a2a2a;
      --abc-blue: #007bff;
      --abc-blue-dark: #0056b3;
      --dev-orange: #ff8c00;
      --dev-yellow: #ffcc00;
      --dev-yellow-dark: #ffb800;
    }

    html,body{height:100%; margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Poppins", sans-serif;}

    .app-header{padding:14px 12px 6px 12px; text-align:center;}
    h1{margin:6px 0 0 0; font-size:1.1rem;}
    h2{margin:2px 0 0 0; font-size:0.95rem; color:#5a4750;}

    .top-controls { display:flex; justify-content:center; gap:10px; margin-top:8px; }

    .btn-navegador {
      display:inline-block;
      background-color:#83bde3;
      color:white;
      border:none;
      border-radius:10px;
      padding:10px 14px;
      font-size:0.95rem;
      cursor:pointer;
    }

    /* Layout: always two columns side-by-side, 50/50 */
    .two-columns {
      display:flex;
      flex-direction:row;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:14px;
      box-sizing:border-box;
      width:100%;
      height: calc(100vh - 120px);
    }

    .panel {
      width:50%;
      min-width:240px;
      box-sizing:border-box;
      background:#fff;
      border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      padding:12px;
      display:flex;
      flex-direction:column;
      align-items:center;
      overflow:hidden;
    }

    .panel-title {
      width:100%;
      text-align:left;
      font-weight:600;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    /* Player main controls (kept similar to your original) */
    .play-main {
      font-size:20px;
      padding:14px 28px;
      border:none;
      border-radius:12px;
      color:white;
      cursor:pointer;
      margin-bottom:12px;
      width:85%;
      max-width:420px;
    }

    /* left = dev (orange) */
    #mainPlayPauseDev { background:var(--dev-orange); }
    /* right = abc (green like original) */
    #mainPlayPause { background:#28a745; }

    .player-container { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px; width:100%; }
    audio { width:70%; max-width:420px; }

    .control-btn {
      font-size:22px;
      padding:8px 12px;
      border:none;
      border-radius:10px;
      background:var(--abc-blue);
      color:white;
      cursor:pointer;
    }

    .control-btn-dev { background:var(--abc-blue); } /* same icon color for prev/next */

    .nowPlaying { font-size:15px; color:#333; margin-bottom:6px; text-align:center; min-height:26px; }

    /* List buttons: match sizes but smaller for mobile compactness */
    .list-scroll { width:100%; overflow-y:auto; padding:6px; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; }

    .track-btn {
      font-size:18px;
      padding:14px 18px;
      border:none;
      border-radius:12px;
      background:var(--abc-blue);
      color:white;
      cursor:pointer;
      width:88%;
      margin:0 auto;
      transition:background-color 0.2s;
      text-align:left;
    }
    .track-btn.active { background:var(--abc-blue-dark); }

    /* dev list style: yellow */
    .track-btn-dev {
      font-size:18px;
      padding:14px 18px;
      border:none;
      border-radius:12px;
      background:var(--dev-yellow);
      color:#000;
      cursor:pointer;
      width:88%;
      margin:0 auto;
      transition:background-color 0.15s;
      text-align:left;
    }
    .track-btn-dev.active { background:var(--dev-yellow-dark); color:#000; }

    /* smaller sizes on narrow screens to keep two columns readable */
    @media (max-width:540px) {
      .play-main { font-size:16px; padding:10px 18px; }
      .control-btn { font-size:18px; padding:8px 10px; }
      .track-btn, .track-btn-dev { font-size:16px; padding:10px 12px; width:92%; }
      h1{font-size:1rem;} h2{font-size:0.85rem;}
      /* keep two columns but allow horizontal scroll if needed */
      .two-columns { gap:8px; padding:8px; height: calc(100vh - 110px); }
      .panel { padding:10px; border-radius:10px; }
      audio { width:60%; }
    }

    /* ensure scrollbars visible if lists long */
    .list-scroll::-webkit-scrollbar { height:8px; width:8px; }
    .list-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius:6px; }
    .small-muted { font-size:0.82rem; color:#666; margin-top:6px; }

    /* top video container */
    #videoContainer { display:none; width:100%; justify-content:center; padding:8px 12px; box-sizing:border-box; }
    #videoContainer video { max-width:460px; width:98%; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.08); }

  </style>
</head>
<body>

  <div class="app-header">
    <h1>Mi Playlist – Vida Abundante</h1>
    <h2>Escuchá los audios de enseñanza</h2>

    <div class="top-controls">
      <button id="toggleAppBtn" class="btn-navegador">📱 Ver como aplicación</button>
      <button class="btn-navegador" id="refreshDevListBtn">🔄 Actualizar Devocionales</button>
    </div>
  </div>

  <!-- Video container (shows when toggled) -->
  <div id="videoContainer"><video id="introVideo" src="InstruccionInstalar.mp4" controls autoplay muted loop></video></div>

  <div class="two-columns">
    <!-- LEFT: DEVOCIONALES -->
    <div class="panel" id="devPanel">
      <div class="panel-title"><strong>📙 Devocionales</strong></div>

      <button id="mainPlayPauseDev" class="play-main">▶ Reproducir devocionales</button>
      <button onclick="reiniciarProgresoDev()" class="btn-navegador" style="background:#cc4d00;color:#fff;margin-bottom:8px;">🔁 Reiniciar progreso (Dev)</button>

      <div class="player-container">
        <button class="control-btn" id="prevDev" onclick="prevTrackDev()">⏮</button>
        <audio id="playerDev" controls preload="none"></audio>
        <button class="control-btn" id="nextDev" onclick="nextTrackDev()">⏭</button>
      </div>

      <div id="nowPlayingDev" class="nowPlaying">🎵 Reproduciendo: Nada</div>

      <div class="list-scroll" id="devListContainer">
        <!-- Buttons injected here -->
      </div>
      <div class="small-muted" id="devCount"></div>
    </div>

    <!-- RIGHT: ABC (tu reproductor original) -->
    <div class="panel" id="abcPanel">
      <div class="panel-title"><strong>📘 ABC</strong></div>

      <button id="mainPlayPause" class="play-main" style="background:#28a745;">▶ Reproducir lista completa</button>
      <button onclick="reiniciarProgreso()" class="btn-navegador" style="background-color: #dc3545;">🔁 Reiniciar progreso</button>

      <div class="player-container">
        <button class="control-btn" onclick="prevTrack()">⏮</button>
        <audio id="player" controls preload="none"></audio>
        <button class="control-btn" onclick="nextTrack()">⏭</button>
      </div>

      <div id="nowPlaying" class="nowPlaying">🎵 Reproduciendo: Nada</div>

      <div class="list-scroll" id="abcListContainer">
        <!-- ABC buttons (kept same labels as before) -->
        <button class="track-btn" id="btn0" onclick="playSection(0)">▶ Salvación</button>
        <button class="track-btn" id="btn1" onclick="playSection(1)">▶ Pecado</button>
        <button class="track-btn" id="btn2" onclick="playSection(2)">▶ La Palabra</button>
        <button class="track-btn" id="btn3" onclick="playSection(3)">▶ La Oración</button>
        <button class="track-btn" id="btn4" onclick="playSection(4)">▶ Espíritu Santo</button>
        <button class="track-btn" id="btn5" onclick="playSection(5)">▶ Bautismo</button>
        <button class="track-btn" id="btn6" onclick="playSection(6)">▶ Mayordomía</button>
        <button class="track-btn" id="btn7" onclick="playSection(7)">▶ Evangelismo</button>
        <button class="track-btn" id="btn8" onclick="playSection(8)">▶ Visión de la iglesia</button>
      </div>
    </div>
  </div>

  <div id="loader" style="display:none;"><p>Abriendo...</p></div>

  <script>
    // ---------------------------
    // Top controls: toggle app/web (video)
    // ---------------------------
    const toggleAppBtn = document.getElementById('toggleAppBtn');
    const videoContainer = document.getElementById('videoContainer');
    let appShown = false;
    toggleAppBtn.addEventListener('click', () => {
      appShown = !appShown;
      if (appShown) {
        videoContainer.style.display = 'flex';
        toggleAppBtn.textContent = '🌐 Ver como web';
        // scroll to top so video visible on small screens
        window.scrollTo({top:0, behavior:'smooth'});
      } else {
        videoContainer.style.display = 'none';
        toggleAppBtn.textContent = '📱 Ver como aplicación';
      }
    });

    // refresh dev list button
    document.getElementById('refreshDevListBtn').addEventListener('click', () => {
      cargarDevocionalesAndRender(true);
    });

    // try to register service worker quietly
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    }
  </script>

  <!-- ===================== DEVOCIONALES player (left) ===================== -->
  <script>
    const baseDev = "https://vida-abundante.github.io/playlist-audio/";

    const playerDev = document.getElementById("playerDev");
    const mainBtnDev = document.getElementById("mainPlayPauseDev");
    const nowPlayingDev = document.getElementById("nowPlayingDev");
    const devListContainer = document.getElementById("devListContainer");
    const devCount = document.getElementById("devCount");

    let devList = []; // {title,file,url}
    let devIndex = 0;
    let devMode = "none"; // "none" | "dev"

    // Load devocionales.json fresh. forceReload true bypasses any previous state
    async function cargarDevocionalesAndRender(forceReload=false) {
      try {
        // avoid any caching by adding timestamp param when forced
        const url = baseDev + "devocionales.json" + (forceReload ? `?t=${Date.now()}` : "");
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) {
          devListContainer.innerHTML = "<div style='color:#666'>No hay devocionales aún.</div>";
          devCount.textContent = "";
          devList = [];
          return;
        }
        const j = await res.json();
        // sort by title descending (newest at top). If titles are dates formatted, this works lexicographically.
        j.sort((a,b)=> (b.title || "").localeCompare(a.title || ""));
        devList = j.map(entry => ({ title: entry.title, file: entry.file, url: baseDev + entry.file }));
        renderDevList();
      } catch (e) {
        console.error("Error cargando devos:", e);
        devListContainer.innerHTML = "<div style='color:#666'>Error cargando devocionales.</div>";
        devCount.textContent = "";
        devList = [];
      }
    }

    function renderDevList(){
      devListContainer.innerHTML = "";
      if(!devList.length){ devListContainer.innerHTML = "<div style='color:#666'>No hay devocionales aún.</div>"; devCount.textContent = ""; return; }
      devList.forEach((d,i) => {
        const btn = document.createElement("button");
        btn.className = "track-btn-dev";
        btn.id = "dev_btn_"+i;
        btn.textContent = "▶ " + (d.title || d.file);
        btn.onclick = ()=> playDev(i);
        btn.setAttribute("aria-label", "Reproducir "+(d.title||d.file));
        devListContainer.appendChild(btn);
      });
      devCount.textContent = `${devList.length} devocional(es)`;
    }

    // main button
    mainBtnDev.addEventListener("click", () => {
      if (devMode === "dev") {
        if (playerDev.paused) playerDev.play(); else playerDev.pause();
        updateMainButtonDev();
      } else {
        startDevPlaylist();
      }
    });

    function startDevPlaylist(resume = false){
      if(!devList.length) return;
      devMode = "dev";
      if(!resume) devIndex = 0;
      playDevAt(devIndex);
      updateMainButtonDev();
    }

    function playDevAt(index){
      if(!devList[index]) return;
      devIndex = index;
      playerDev.src = devList[index].url;
      playerDev.play().catch(()=>{});
      playerDev.dataset.mode = "dev";
      playerDev.dataset.index = devIndex;
      updateNowPlayingDev(playerDev.src);
      updateDevButtonStates();
      updateMainButtonDev();
    }

    function playDev(i){
      const isSame = (playerDev.dataset.mode === "dev" && parseInt(playerDev.dataset.index||-1) === i);
      const isPlaying = !playerDev.paused && !playerDev.ended;
      if(isSame){
        if(isPlaying) playerDev.pause(); else playerDev.play();
        updateMainButtonDev();
        return;
      }
      playDevAt(i);
    }

    function nextTrackDev(){
      if(devIndex + 1 < devList.length) playDevAt(devIndex + 1);
      else finishDev();
    }
    function prevTrackDev(){
      if(devIndex > 0) playDevAt(devIndex - 1);
    }
    function finishDev(){
      devMode = "none";
      playerDev.pause();
      playerDev.dataset.mode = "";
      updateNowPlayingDev("");
      updateDevButtonStates();
      updateMainButtonDev();
    }

    function updateNowPlayingDev(src){
      if(!src) { nowPlayingDev.textContent = "🎵 Reproduciendo: Nada"; return; }
      const clean = decodeURIComponent(src.split("?")[0]);
      for(let i=0;i<devList.length;i++){
        if(clean.endsWith(devList[i].file)){
          nowPlayingDev.textContent = "🎵 Reproduciendo: " + (devList[i].title || devList[i].file);
          return;
        }
      }
      nowPlayingDev.textContent = "🎵 Reproduciendo";
    }

    function updateDevButtonStates(){
      devList.forEach((d,i)=>{
        const el = document.getElementById("dev_btn_"+i);
        if(!el) return;
        el.classList.toggle("active", i===devIndex && playerDev && !playerDev.paused);
      });
    }

    function updateMainButtonDev(){
      if(playerDev.dataset.mode === "dev") mainBtnDev.textContent = playerDev.paused ? "▶ Reanudar devocionales" : "⏸ Pausar devocionales";
      else mainBtnDev.textContent = "▶ Reproducir devocionales";
    }

    // persist dev progress
    function guardarProgresoDev(){
      const modo = playerDev.dataset.mode || devMode;
      const index = playerDev.dataset.index || 0;
      const time = playerDev.currentTime || 0;
      localStorage.setItem("modoReproduccionDev", modo);
      localStorage.setItem("indiceActualDev", index);
      localStorage.setItem("tiempoActualDev", time);
    }

    function reiniciarProgresoDev(){
      if(!confirm("¿Querés reiniciar el progreso de Devocionales?")) return;
      localStorage.removeItem("modoReproduccionDev");
      localStorage.removeItem("indiceActualDev");
      localStorage.removeItem("tiempoActualDev");
      location.reload();
    }

    // playerDev events
    playerDev.addEventListener("ended", ()=> {
      if(devIndex +1 < devList.length) playDevAt(devIndex+1);
      else finishDev();
    });
    playerDev.addEventListener("play", ()=> { updateDevButtonStates(); updateMainButtonDev(); updateNowPlayingDev(playerDev.src); });
    playerDev.addEventListener("pause", ()=> { updateDevButtonStates(); updateMainButtonDev(); guardarProgresoDev(); });

    // load devs immediately
    cargarDevocionalesAndRender();

  </script>

  <!-- ===================== ABC player (right) - ORIGINAL with prev/next fixes ===================== -->
  <script>
    const base = "https://vida-abundante.github.io/playlist-audio/";

    const sections = [
      ["Salvación.mp3"],
      ["Pecado.mp3"],
      ["La palabra 1.mp3", "La palabra 2.mp3", "La palabra 3.mp3"],
      ["La oración 1.mp3", "La oración 2.mp3", "La oración 3.mp3", "La oración 4.mp3", "La oración 5.mp3"],
      ["Espíritu Santo 1.mp3", "Espíritu Santo 2.mp3", "Espíritu Santo 3.mp3"],
      ["Bautismo 1.mp3", "Bautismo 2.mp3"],
      ["Mayordomía 1.mp3", "Mayordomía 2.mp3"],
      ["Evangelismo.mp3"],
      ["Visión de la iglesia.mp3"]
    ];

    const sectionNames = ["Salvación", "Pecado", "La Palabra", "La Oración", "Espíritu Santo", "Bautismo", "Mayordomía", "Evangelismo", "Visión de la iglesia"];

    // compute flattened playlist and section index ranges
    const fullPlaylist = sections.flat().map(n => base + n);
    const sectionStartIndex = (() => {
      const starts = [];
      let idx = 0;
      for(let i=0;i<sections.length;i++){
        starts.push(idx);
        idx += sections[i].length;
      }
      return starts;
    })();
    const sectionEndIndex = (() => {
      const ends = [];
      let idx = -1;
      for(let i=0;i<sections.length;i++){
        idx += sections[i].length;
        ends.push(idx);
      }
      return ends;
    })();

    const player = document.getElementById("player");
    const mainBtn = document.getElementById("mainPlayPause");
    const nowPlaying = document.getElementById("nowPlaying");
    const trackButtons = Array.from(document.getElementsByClassName("track-btn"));

    let mode = "none";
    let fullIndex = 0;
    let waiting = false;

    // Helper: find section index and local index for a given flattened fullIndex
    function sectionForFullIndex(fi){
      for(let s=0;s<sections.length;s++){
        const start = sectionStartIndex[s];
        const end = sectionEndIndex[s];
        if(fi >= start && fi <= end) return {section:s, local: fi - start};
      }
      return null;
    }

    // Helper: determine current section index from player.dataset.list (if playing a section)
    function currentSectionFromPlayerDataset(){
      try{
        const list = JSON.parse(player.dataset.list || "[]");
        if(!list.length) return null;
        // find which section has this exact sequence (by file names)
        for(let s=0;s<sections.length;s++){
          const sec = sections[s].map(n=> base + n);
          // compare lengths and each entry
          if(sec.length !== list.length) continue;
          let ok = true;
          for(let k=0;k<sec.length;k++) if(decodeURIComponent(sec[k]) !== decodeURIComponent(list[k])) { ok = false; break; }
          if(ok) return s;
        }
      }catch(e){}
      return null;
    }

    mainBtn.addEventListener("click", () => {
      if (mode === "none") {
        startFullPlaylist();
      } else {
        togglePlayPauseCurrent();
      }
    });

    function startFullPlaylist(resume = false) {
      mode = "full";
      if (!resume) fullIndex = 0;
      playFullAt(fullIndex);
      updateMainButton();
    }

    function playFullAt(index) {
      fullIndex = index;
      playTrackFromList(fullPlaylist, fullIndex);
      player.dataset.mode = "full";
      player.dataset.index = fullIndex;
      updateMainButton();
    }

    function playSection(sectionIdx) {
      const list = sections[sectionIdx].map(n => base + n);
      const currentSrc = player.src;
      const isSameSection = (player.dataset.mode === "section" && player.dataset.section == sectionIdx);
      const isPlaying = !player.paused;

      if (isSameSection) {
        if (isPlaying) player.pause(); else player.play();
        updateMainButton();
        return;
      }

      mode = "section";
      player.dataset.mode = "section";
      player.dataset.section = sectionIdx;
      playTrackFromList(list, 0);
      updateButtonStates();
      updateMainButton();
    }

    function playTrackFromList(list, index) {
      // set src to list[index] and play
      player.src = list[index];
      player.play().catch(()=>{});
      player.dataset.list = JSON.stringify(list);
      player.dataset.index = index;
      updateNowPlaying(player.src);
    }

    // FIXED next/prev logic
    function nextTrack() {
      const currentMode = player.dataset.mode || (mode === "full" ? "full" : "section");
      if (currentMode === "full") {
        if (fullIndex < fullPlaylist.length - 1) {
          const isEndOfSection = sectionEndIndex.includes(fullIndex);
          if (isEndOfSection) waitAndPlayFull(fullIndex + 1);
          else playFullAt(fullIndex + 1);
        } else finishFullPlaylist();
      } else {
        // section mode
        const list = JSON.parse(player.dataset.list || "[]");
        let i = parseInt(player.dataset.index || 0);
        if (i + 1 < list.length) {
          playTrackFromList(list, i + 1);
        } else {
          // at end of current section -> go to next section if exists
          const curSection = currentSectionFromPlayerDataset();
          if (curSection !== null && curSection + 1 < sections.length) {
            // play first track of next section
            const nextList = sections[curSection + 1].map(n => base + n);
            player.dataset.mode = "section";
            player.dataset.section = curSection + 1;
            playTrackFromList(nextList, 0);
            updateButtonStates();
            updateMainButton();
          } else {
            finishSection();
          }
        }
      }
    }

    function prevTrack() {
      const currentMode = player.dataset.mode || (mode === "full" ? "full" : "section");
      if (currentMode === "full") {
        if (fullIndex > 0) playFullAt(fullIndex - 1);
      } else {
        const list = JSON.parse(player.dataset.list || "[]");
        let i = parseInt(player.dataset.index || 0);
        if (i > 0) {
          playTrackFromList(list, i - 1);
        } else {
          // at start of current section -> go to previous section if exists
          const curSection = currentSectionFromPlayerDataset();
          if (curSection !== null && curSection - 1 >= 0) {
            const prevList = sections[curSection - 1].map(n => base + n);
            // play last track of previous section
            player.dataset.mode = "section";
            player.dataset.section = curSection - 1;
            playTrackFromList(prevList, prevList.length - 1);
            updateButtonStates();
            updateMainButton();
          } else {
            // nothing to do
          }
        }
      }
    }

    async function waitAndPlayFull(nextIdx) {
      if (waiting) return;
      waiting = true;
      updateNowPlaying("⏸ Esperando 2s...");
      await new Promise(r => setTimeout(r, 2000));
      waiting = false;
      playFullAt(nextIdx);
    }

    function togglePlayPauseCurrent() {
      if (!player.src) { startFullPlaylist(); return; }
      if (player.paused) player.play(); else player.pause();
      updateMainButton();
    }

    player.addEventListener("ended", () => {
      const currentMode = player.dataset.mode || (mode === "full" ? "full" : "section");
      if (currentMode === "full") {
        const idx = fullIndex;
        if (idx >= fullPlaylist.length - 1) finishFullPlaylist();
        else {
          const isEndOfSection = sectionEndIndex.includes(idx);
          if (isEndOfSection) waitAndPlayFull(idx + 1);
          else playFullAt(idx + 1);
        }
      } else {
        const list = JSON.parse(player.dataset.list || "[]");
        let i = parseInt(player.dataset.index || 0);
        if (i + 1 < list.length) playTrackFromList(list, i + 1);
        else {
          // at end of section -> go to next section or finish
          const curSection = currentSectionFromPlayerDataset();
          if (curSection !== null && curSection + 1 < sections.length) {
            const nextList = sections[curSection + 1].map(n => base + n);
            player.dataset.mode = "section";
            player.dataset.section = curSection + 1;
            playTrackFromList(nextList, 0);
            updateButtonStates();
            updateMainButton();
          } else {
            finishSection();
          }
        }
      }
    });

    player.addEventListener("play", () => { updateButtonStates(); updateMainButton(); updateNowPlaying(player.src); });
    player.addEventListener("pause", () => { updateButtonStates(); updateMainButton(); guardarProgreso(); });

    function finishFullPlaylist() {
      mode = "none";
      player.pause();
      updateMainButton();
      updateButtonStates();
      updateNowPlaying("");
    }

    function finishSection() {
      mode = "none";
      player.pause();
      player.dataset.mode = "";
      updateNowPlaying("");
      updateButtonStates();
      updateMainButton();
    }

    function updateMainButton() {
      if (mode === "none") mainBtn.textContent = "▶ Reproducir lista completa";
      else if (mode === "full") mainBtn.textContent = player.paused ? "▶ Reanudar lista completa" : "⏸ Pausar lista completa";
      else if (mode === "section") mainBtn.textContent = player.paused ? "▶ Reanudar" : "⏸ Pausar";
    }

    function updateNowPlaying(src) {
      if (!src) { nowPlaying.textContent = "🎵 Reproduciendo: Nada"; return; }
      const cleanSrc = decodeURIComponent(src.split("?")[0]);
      for (let s = 0; s < sections.length; s++) {
        const section = sections[s];
        for (let i = 0; i < section.length; i++) {
          if (cleanSrc.endsWith(section[i])) {
            const label = sectionNames[s];
            const pos = section.length > 1 ? ` (${i + 1} de ${section.length})` : "";
            nowPlaying.textContent = `🎵 Reproduciendo: ${label}${pos}`;
            return;
          }
        }
      }
      nowPlaying.textContent = "🎵 Reproduciendo";
    }

    function updateButtonStates() {
      trackButtons.forEach((btn, i) => {
        const label = sectionNames[i];
        const isActive = (player.dataset.mode === "section" && parseInt(player.dataset.section || -1) === i && !player.paused);
        btn.textContent = (isActive ? "⏸ " : "▶ ") + label;
        btn.classList.toggle("active", isActive);
      });
    }

    function guardarProgreso() {
      const modo = player.dataset.mode || mode;
      const index = player.dataset.index || 0;
      const time = player.currentTime || 0;
      const section = player.dataset.section || null;

      localStorage.setItem("modoReproduccion", modo);
      localStorage.setItem("indiceActual", index);
      localStorage.setItem("tiempoActual", time);
      localStorage.setItem("seccionActual", section);
    }

    // Restore saved state for ABC
    document.addEventListener("DOMContentLoaded", () => {
      const modoGuardado = localStorage.getItem("modoReproduccion");
      const indexGuardado = parseInt(localStorage.getItem("indiceActual") || 0);
      const tiempoGuardado = parseFloat(localStorage.getItem("tiempoActual") || 0);
      const seccionGuardada = parseInt(localStorage.getItem("seccionActual"));
      if (modoGuardado === "full") {
        mode = "full";
        player.src = fullPlaylist[indexGuardado];
        player.dataset.mode = "full";
        player.dataset.index = indexGuardado;
        player.currentTime = tiempoGuardado;
        updateNowPlaying(player.src);
      } else if (modoGuardado === "section" && !isNaN(seccionGuardada)) {
        mode = "section";
        const list = sections[seccionGuardada].map(n => base + n);
        player.src = list[indexGuardado];
        player.dataset.mode = "section";
        player.dataset.section = seccionGuardada;
        player.dataset.list = JSON.stringify(list);
        player.dataset.index = indexGuardado;
        player.currentTime = tiempoGuardado;
        updateNowPlaying(player.src);
      }
      updateMainButton();
      updateButtonStates();
    });

    // Autosave left and right players
    setInterval(() => {
      if (!player.paused && player.src) guardarProgreso();
      if (!playerDev.paused && playerDev.src) guardarProgresoDev();
    }, 10000);

  </script>

  <script>
    // Reiniciar progreso ABC (right)
    function reiniciarProgreso() {
      if (!confirm("¿Estás seguro de que querés reiniciar el progreso?")) return;
      localStorage.removeItem("modoReproduccion");
      localStorage.removeItem("indiceActual");
      localStorage.removeItem("tiempoActual");
      localStorage.removeItem("seccionActual");
      location.reload();
    }
  </script>

</body>
</html>
